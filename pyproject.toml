[project]
name = "python-from-zero-to-nerd-2026"
version = "0.1.0"
description = "A practical Python learning journey from fundamentals to advanced engineering."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Ritish Bhatoye"},
]

[tool.pytest.ini_options]
testpaths = ["01_core_python", "02_intermediate_python", "03_oop", "projects"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
